name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Upload exact distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  source:
    name: Source / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run source checkout suite
        run: python -m pytest -q -m "not packaging"

  wheel:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out test suite
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download exact distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: downloaded-dist
      - name: Install test runner
        run: python -m pip install pytest
      - name: Smoke exact downloaded wheel
        env:
          YUPP_DISTRIBUTIONS: ${{ github.workspace }}/downloaded-dist
        run: python -m pytest -q tests/test_packaging.py::test_wheel_clean_install_codec_cli_resources_and_shadow_safety

  artifact:
    name: Sdist and artifact gates
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out test suite
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Download exact distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: downloaded-dist
      - name: Install artifact test tools
        run: python -m pip install build pytest "setuptools>=77" wheel
      - name: Verify exact artifacts and rebuilt sdist
        env:
          YUPP_DISTRIBUTIONS: ${{ github.workspace }}/downloaded-dist
        run: >-
          python -m pytest -q
          tests/test_packaging.py::test_metadata_is_static_and_artifacts_are_complete
          tests/test_packaging.py::test_sdist_rebuild_has_equivalent_wheel_and_installs
          tests/test_packaging.py::test_uninstall_removes_startup_hook_and_codec

  future:
    name: Advisory / Python 3.15-dev
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.15 prerelease
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.15-dev"
          allow-prereleases: true
      - name: Download exact distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: downloaded-dist
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run advisory source suite
        run: python -m pytest -q -m "not packaging"
      - name: Smoke exact downloaded wheel
        if: ${{ always() }}
        env:
          YUPP_DISTRIBUTIONS: ${{ github.workspace }}/downloaded-dist
        run: python -m pytest -q tests/test_packaging.py::test_wheel_clean_install_codec_cli_resources_and_shadow_safety
