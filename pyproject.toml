[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yupp"
version = "2.0rc1"
description = "yet another lexical preprocessor"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vitaly Kravtsov", email = "in4lio@gmail.com" },
]
keywords = ["preprocessor", "macros", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/in4lio/yupp/"
Repository = "https://github.com/in4lio/yupp/"

[project.scripts]
yupp = "yupp.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["yupp*"]

[tool.setuptools.package-data]
yupp = [
    "lib/*.h",
    "lib/*.md",
    "lib/*.yu",
    "lib/eg/*.py",
]
